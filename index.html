<!doctype html>
<html class="landing" lang="es" manifest="cache.appcache">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FeWi PS4 Host</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* FeWi landing page only. No change to the GoldHEN / exploit screen. */
    html.landing,html.landing body { background:#090f1c; color:#e9f4ff; }
    html.landing body { background-image:radial-gradient(ellipse at 13% 20%,rgba(29,97,184,.21),transparent 45%),radial-gradient(ellipse at 85% 78%,rgba(18,63,124,.2),transparent 50%); }
    html.landing #brand { padding:16px 10px; background:#0b1526; border-color:#28466d; }
    html.landing #brand b { font-size:19px; color:#76bdff; letter-spacing:.17em; }
    html.landing .shell { width:100%;max-width:1120px;margin:0 auto;gap:28px;padding:30px 16px 80px; }
    html.landing .fewi-gallery { display:flex;flex:1 1 360px;gap:12px;justify-content:center;align-items:center; }
    html.landing .fewi-photo { display:block;width:46%;max-width:210px;height:auto;aspect-ratio:210/286;object-fit:cover;border:2px solid #3482cf;border-radius:14px;box-shadow:0 0 22px rgba(32,118,204,.23); }
    html.landing .fewi-photo:nth-child(2) { transform:translateY(13px); }
    html.landing .panel { width:100%;max-width:410px;flex:1 1 330px;background:#0e1a2d;border:1px solid #2a4e7a;border-radius:16px;padding:23px;box-shadow:0 12px 38px rgba(0,0,0,.36); }
    html.landing .fewi-eyebrow { color:#85bbed;font-size:12px;letter-spacing:.2em;font-weight:700;text-transform:uppercase; }
    html.landing .fewi-quote { margin:10px 0 13px;color:#fff;font-size:clamp(22px,3.6vw,30px);line-height:1.2;font-weight:800; }
    html.landing .lede { font-size:13px;color:#a8c3e3;letter-spacing:normal;margin-bottom:18px; }
    html.landing .opt { border-color:#2b527f;background:#10233c;color:#dcecff; }
    html.landing .opt-auto { background:#101b2e;color:#b6cee8; }
    html.landing .btn { background:#1465bd;border-color:#58adff;color:#fff;border-radius:8px; }
    html.landing .btn:hover { background:#1a77d7;border-color:#a5d7ff; }
    html.landing .byline { color:#859bb5; }
    html.landing .fewi-credit { color:#98abc1;font-size:11px;text-align:center;margin:16px auto 2px; }
    @media(max-width:690px) { html.landing .shell { padding:18px 12px 80px;gap:22px; }html.landing .fewi-gallery { flex-basis:100%; }html.landing .fewi-photo { max-width:145px; }html.landing .fewi-photo:nth-child(2) { transform:translateY(7px); }html.landing .panel { max-width:480px; } }
  </style>
</head>
<body>
  <div id="brand"><b>FEWI PS4 HOST</b></div>
  <div class="shell">
    <div class="fewi-gallery" aria-label="Dos fotos del chihuahua de FeWi">
      <img class="fewi-photo" src="chihuahua-frente.jpg" alt="Chihuahua sentado mirando al frente" />
      <img class="fewi-photo" src="chihuahua-jugando.jpg" alt="Chihuahua tumbado jugando" />
    </div>
    <main class="panel">
      <div class="fewi-eyebrow">FeWi Edition · PlayStation 4</div>
      <h1 class="fewi-quote">¡Sí que eres payo, que he venido yo a hackearte las Play!</h1>
      <p class="lede">PS4 · Firmware 13.52 / 14.00</p>
      <form class="pick" id="pick">
        <label class="opt"><input type="radio" name="payload" value="hen" /><span>ps4-hen</span></label>
        <label class="opt"><input type="radio" name="payload" value="goldhen" checked /><span>GoldHEN</span></label>
        <label class="opt opt-auto"><input type="checkbox" id="auto" /><span>autostart</span></label>
        <button class="btn" type="submit">START</button>
        <p class="count" id="count"></p>
        <p class="count" id="cache-status" aria-live="polite">Cache: checking...</p>
      </form>
      <p class="fewi-credit">Diseño FeWi · Basado en Afterglow, por well0nez/m0zz</p>
    </main>
  </div>
  <p class="byline">afterglow by well0nez/m0zz</p>
  <script src="launch.js"></script>
</body>
</html>
